<script>
    // 1. Aquí definimos la dirección de tu "Cerebro" en Render
    const API_URL = 'https://rio-fac.onrender.com';

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('result').classList.add('hidden');

        const formData = new FormData();
        formData.append('file', file);

        try {
            // 2. Aquí corregimos el "cable": enviamos la foto a Render
            const response = await fetch(`${API_URL}/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // 3. Mostramos los resultados que nos devuelve el robot
            document.getElementById('comercio').textContent = data.datos_extraidos.comercio || 'No detectado';
            document.getElementById('fecha').textContent = data.datos_extraidos.fecha || 'No detectada';
            document.getElementById('total').textContent = '$' + (data.datos_extraidos.total || '0');

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
        } catch (error) {
            console.error('Error:', error);
            alert('Error al conectar con el robot de Render');
            document.getElementById('loading').classList.add('hidden');
        }
    });

    function verHistorial() {
        window.location.href = `${API_URL}/facturas`;
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
