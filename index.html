<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Facturas OCR</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Extrae datos de facturas con OCR">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 OCR Facturas</h1>
            <p>Sube una foto de tu factura</p>
        </header>

        <main>
            <!-- Sección de carga -->
            <div class="upload-section" id="uploadSection">
                <label for="fileInput" class="upload-btn">
                    📷 Seleccionar Imagen
                </label>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <!-- Indicador de carga -->
            <div class="loading hidden" id="loading">
                <div class="spinner"></div>
                <p>Procesando factura...</p>
            </div>

            <!-- Resultados -->
            <div class="result hidden" id="result">
                <h2>✅ Datos Extraídos</h2>
                <div class="data-card">
                    <p><strong>Comercio:</strong> <span id="comercio">-</span></p>
                    <p><strong>Fecha:</strong> <span id="fecha">-</span></p>
                    <p><strong>Total:</strong> <span id="total">-</span></p>
                    <p><strong>Motor usado:</strong> <span id="motor">-</span></p>
                </div>
                <button class="btn-secondary" onclick="resetApp()">
                    🔄 Subir otra factura
                </button>
            </div>
        </main>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
